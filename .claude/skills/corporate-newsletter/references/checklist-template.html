<title>Corporates Wire Desk</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #F5F9F8;
    --border: #DDE7E4;
    --text: #1B2523;
    --muted: #667370;
    --accent: #0F6D63;
    --accent-soft: #E3F3EE;
    --tag-bg: #FFF4E0;
    --tag-text: #8A5A00;
    --btn-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14201d;
      --panel: #1B2926;
      --border: #2B3B37;
      --text: #E9F2F0;
      --muted: #9AAFAB;
      --accent: #4FCBAF;
      --accent-soft: #1E3A34;
      --tag-bg: #3A2E14;
      --tag-text: #F0C674;
      --btn-text: #0A1614;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14201d;
    --panel: #1B2926;
    --border: #2B3B37;
    --text: #E9F2F0;
    --muted: #9AAFAB;
    --accent: #4FCBAF;
    --accent-soft: #1E3A34;
    --tag-bg: #3A2E14;
    --tag-text: #F0C674;
    --btn-text: #0A1614;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 20px; margin: 4px 0 2px; color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    background: none; border: none; padding: 10px 4px; font-size: 14px; font-weight: 600;
    color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .panel { display: none; }
  .panel.active { display: block; }
  .section-heading {
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
    color: var(--accent); margin: 22px 0 8px; padding-top: 10px; border-top: 1px solid var(--border);
  }
  .section-heading:first-child { border-top: none; margin-top: 0; }
  .item-row {
    display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px;
  }
  .item-row:hover { background: var(--panel); }
  .item-row input[type="checkbox"] { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); flex-shrink: 0; }
  .item-num { color: var(--muted); font-size: 12px; min-width: 22px; margin-top: 2px; flex-shrink: 0; }
  .item-body { flex: 1; min-width: 0; }
  .item-headline { font-size: 14px; font-weight: 600; }
  .item-headline a { color: var(--text); text-decoration: none; }

  .item-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .item-tag {
    display: inline-block; margin-top: 4px; font-size: 11px; padding: 2px 7px; border-radius: 999px;
    background: var(--tag-bg); color: var(--tag-text);
  }
  .catrow .item-body { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; }
  .catrow .item-text { flex: 1 1 260px; min-width: 0; }
  .catrow input[type="text"] {
    flex: 0 1 180px; min-width: 120px; padding: 6px 8px; font-size: 13px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--bg); color: var(--text);

</style>
<div class="wrap">
  <h1>Corporates Wire Desk</h1>
  <div class="sub">Check what belongs in this week's issue. Use <strong>Select</strong> for a plain yes/no pass, or <strong>Categorize</strong> to also assign a section — either way, hit Copy and paste the result back into chat.</div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="select">Select</button>
    <button class="tab-btn" data-tab="categorize">Categorize</button>
  </div>

  <div class="panel active" id="panel-select"></div>
  <div class="panel" id="panel-categorize"></div>

  <div class="toolbar">
    <button class="action" id="copy-btn">Copy</button>
    <span class="count" id="count-label"></span>
    <span class="copied-flash" id="copied-flash">Copied!</span>
  </div>
  <textarea class="output" id="output-box" readonly></textarea>
</div>

<script type="application/json" id="items-data">
[
  { "id": 1, "section": "Tax & Compliance", "headline": "Example: Avalara launches new e-invoicing module for EU VAT", "url": "https://example.com/1", "source": "Avalara", "date": "Sep 18, 2026", "tag": "" },
  { "id": 2, "section": "Tax & Compliance", "headline": "Example: Sovos partners with a regional ERP vendor", "url": "https://example.com/2", "source": "Sovos", "date": "Sep 19, 2026", "tag": "" },
  { "id": 3, "section": "Legal & Risk", "headline": "Example: Wolters Kluwer announces AI feature for contract review", "url": "https://example.com/3", "source": "Wolters Kluwer", "date": "Sep 17, 2026", "tag": "borderline relevance — flagging rather than dropping" },
  { "id": 4, "section": "Funding & M&A", "headline": "Example: Kintsugi raises Series B", "url": "https://example.com/4", "source": "Kintsugi (LinkedIn)", "date": "Sep 20, 2026", "tag": "found via web search — not a direct site scan, verify before use" }
]
</script>

<script>
(function () {
  var ITEMS = JSON.parse(document.getElementById('items-data').textContent);
  var selected = {};   // id -> bool
  var categories = {}; // id -> string

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function groupBySection(items) {
    var order = [], map = {};
    items.forEach(function (it) {
      if (!map[it.section]) { map[it.section] = []; order.push(it.section); }
      map[it.section].push(it);
    });
    return order.map(function (s) { return { section: s, items: map[s] }; });
  }

  function renderSelect() {
    var html = "";
    groupBySection(ITEMS).forEach(function (grp) {
      html += '<div class="section-heading">' + esc(grp.section) + '</div>';
      grp.items.forEach(function (it) {
        html += '' +
          '<label class="item-row">' +
            '<input type="checkbox" data-id="' + it.id + '" class="sel-check">' +
            '<span class="item-num">#' + it.id + '</span>' +
            '<span class="item-body">' +
              '<div class="item-headline"><a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.headline) + '</a></div>' +
              '<div class="item-meta">' + esc(it.source) + ' &middot; ' + esc(it.date) + '</div>' +
              (it.tag ? '<div class="item-tag">' + esc(it.tag) + '</div>' : '') +
            '</span>' +
          '</label>';
      });
    });
    document.getElementById('panel-select').innerHTML = html;
  }

  function renderCategorize() {
    var html = "";
    groupBySection(ITEMS).forEach(function (grp) {
      html += '<div class="section-heading">' + esc(grp.section) + ' <span style="color:var(--muted);font-weight:400;">(scanned as)</span></div>';
      grp.items.forEach(function (it) {
        html += '' +
          '<div class="item-row catrow">' +
            '<input type="checkbox" data-id="' + it.id + '" class="cat-check">' +
            '<span class="item-num">#' + it.id + '</span>' +
            '<span class="item-body">' +
              '<span class="item-text">' +
                '<div class="item-headline"><a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.headline) + '</a></div>' +
                '<div class="item-meta">' + esc(it.source) + ' &middot; ' + esc(it.date) + '</div>' +
                (it.tag ? '<div class="item-tag">' + esc(it.tag) + '</div>' : '') +
              '</span>' +
              '<input type="text" data-id="' + it.id + '" class="cat-input" placeholder="Section name&hellip;">' +
            '</span>' +
          '</div>';
      });
    });
    document.getElementById('panel-categorize').innerHTML = html;
  }

  function syncCheckboxesToState() {
    document.querySelectorAll('.sel-check, .cat-check').forEach(function (cb) {
      cb.checked = !!selected[cb.getAttribute('data-id')];
    });
    document.querySelectorAll('.cat-input').forEach(function (inp) {
      inp.value = categories[inp.getAttribute('data-id')] || "";
    });
    updateCount();
  }

  function updateCount() {
    var n = Object.keys(selected).filter(function (k) { return selected[k]; }).length;
    document.getElementById('count-label').textContent = n + ' selected';
  }

  document.addEventListener('change', function (e) {
    if (e.target.classList.contains('sel-check') || e.target.classList.contains('cat-check')) {
      var id = e.target.getAttribute('data-id');
      selected[id] = e.target.checked;
      syncCheckboxesToState();
    }
    if (e.target.classList.contains('cat-input')) {
      categories[e.target.getAttribute('data-id')] = e.target.value;
    }
  });

  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function (p) { p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('panel-' + btn.getAttribute('data-tab')).classList.add('active');
      syncCheckboxesToState();
    });
  });

  function currentTab() {
    return document.querySelector('.tab-btn.active').getAttribute('data-tab');
  }

  function buildOutput() {
    var ids = Object.keys(selected).filter(function (k) { return selected[k]; }).map(Number).sort(function (a, b) { return a - b; });
    if (!ids.length) return "";
    if (currentTab() === 'select') {
      return "Include these numbered items in the newsletter: " + ids.join(", ");
    }
    var groups = {}, order = [];
    ids.forEach(function (id) {
      var cat = (categories[id] || "").trim() || "Uncategorized";
      if (!groups[cat]) { groups[cat] = []; order.push(cat); }
      groups[cat].push(id);
    });
    var parts = order.map(function (cat) { return cat + ": " + groups[cat].join(", "); });
    return "Include these numbered items in the newsletter, grouped as follows: " + parts.join(" / ");
  }

  document.getElementById('copy-btn').addEventListener('click', function () {
    var out = buildOutput();
    var box = document.getElementById('output-box');
    box.value = out;
    var flash = document.getElementById('copied-flash');
    function showFlash() {
      flash.classList.add('show');
      setTimeout(function () { flash.classList.remove('show'); }, 1200);
    }
    if (!out) { box.value = "(nothing selected yet)"; return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(out).then(showFlash).catch(function () {
        box.select(); showFlash();
      });
    } else {
      box.select(); showFlash();
    }
  });

  renderSelect();
  renderCategorize();
  updateCount();
})();
</script>
