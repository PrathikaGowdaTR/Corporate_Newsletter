<style>

      --accent: #4FCBAF;
      --tag-bg: #3A2E14;
      --tag-text: #F0C674;
      --btn-text: #0A1614;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14201d;
    --panel: #1B2926;
    --border: #2B3B37;
    --text: #E9F2F0;
    --muted: #9AAFAB;
    --accent: #4FCBAF;

<div class="wrap">
  <h1>Corporates Wire Desk</h1>
  <div class="sub">Check what belongs in this week's issue, then hit Copy and paste the result back into chat. Everything runs under one section (Corporate Tax and Trade) — the groupings below are just to make a long list easier to scan.</div>

  <div id="list"></div>

  <div class="toolbar">
    <button class="action" id="copy-btn">Copy</button>
    <span class="count" id="count-label"></span>
    <span class="copied-flash" id="copied-flash">Copied!</span>
  </div>
  <textarea class="output" id="output-box" readonly></textarea>
</div>

<script type="application/json" id="items-data">
[
  { "id": 1, "group": "Tax compliance", "headline": "Example: Avalara launches new e-invoicing module for EU VAT", "url": "https://example.com/1", "source": "Avalara", "date": "Sep 18, 2026", "tag": "" },
  { "id": 2, "group": "Tax compliance", "headline": "Example: Sovos partners with a regional ERP vendor", "url": "https://example.com/2", "source": "Sovos", "date": "Sep 19, 2026", "tag": "" },
  { "id": 3, "group": "Legal & risk", "headline": "Example: Wolters Kluwer announces AI feature for contract review", "url": "https://example.com/3", "source": "Wolters Kluwer", "date": "Sep 17, 2026", "tag": "borderline relevance — flagging rather than dropping" },
  { "id": 4, "group": "Funding & M&A", "headline": "Example: Kintsugi raises Series B", "url": "https://example.com/4", "source": "Kintsugi (LinkedIn)", "date": "Sep 20, 2026", "tag": "found via web search — not a direct site scan, verify before use" }
]
</script>

<script>
(function () {
  var ITEMS = JSON.parse(document.getElementById('items-data').textContent);
  var selected = {}; // id -> bool

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function groupByGroup(items) {
    var order = [], map = {};
    items.forEach(function (it) {
      if (!map[it.group]) { map[it.group] = []; order.push(it.group); }
      map[it.group].push(it);
    });
    return order.map(function (g) { return { group: g, items: map[g] }; });
  }

  function render() {
    var html = "";
    groupByGroup(ITEMS).forEach(function (grp) {
      html += '<div class="section-heading">' + esc(grp.group) + '</div>';
      grp.items.forEach(function (it) {
        html += '' +
          '<label class="item-row">' +
            '<input type="checkbox" data-id="' + it.id + '" class="sel-check">' +
            '<span class="item-num">#' + it.id + '</span>' +
            '<span class="item-body">' +
              '<div class="item-headline"><a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.headline) + '</a></div>' +
              '<div class="item-meta">' + esc(it.source) + ' &middot; ' + esc(it.date) + '</div>' +
              (it.tag ? '<div class="item-tag">' + esc(it.tag) + '</div>' : '') +
            '</span>' +
          '</label>';
      });
    });
    document.getElementById('list').innerHTML = html;
  }

  function updateCount() {
    var n = Object.keys(selected).filter(function (k) { return selected[k]; }).length;
    document.getElementById('count-label').textContent = n + ' selected';
  }

  document.addEventListener('change', function (e) {
    if (e.target.classList.contains('sel-check')) {
      selected[e.target.getAttribute('data-id')] = e.target.checked;
      updateCount();
    }
  });

  function buildOutput() {
    var ids = Object.keys(selected).filter(function (k) { return selected[k]; }).map(Number).sort(function (a, b) { return a - b; });
    if (!ids.length) return "";
    return "Include these numbered items in the newsletter: " + ids.join(", ");
  }

  document.getElementById('copy-btn').addEventListener('click', function () {
    var out = buildOutput();
    var box = document.getElementById('output-box');
    box.value = out;
    var flash = document.getElementById('copied-flash');
    function showFlash() {
      flash.classList.add('show');
      setTimeout(function () { flash.classList.remove('show'); }, 1200);
    }
    if (!out) { box.value = "(nothing selected yet)"; return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(out).then(showFlash).catch(function () {
        box.select(); showFlash();
      });
    } else {
      box.select(); showFlash();
    }
  });

  render();
  updateCount();
})();
</script>
